# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Lint (ESLint with the complexity ceilings, Prettier, Halstead
# difficulty), npm audit, the mocha suite at 100% coverage on Node.js 22
# and 24 with the example run over stdio, and the npm tarball listing.
# Nothing here publishes; release.yml does, from a signed tag
# (DEVELOPMENT.md).
name: CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format, complexity, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Locked dependencies
        run: npm ci
      - name: ESLint (cyclomatic 10, cognitive 15, 60 lines, 500 per file)
        run: make lint
      - name: Prettier
        run: make format-check
      - name: Halstead difficulty (30)
        run: make complexity
      - name: Known vulnerabilities (npm audit)
        run: make audit

  test:
    name: Tests and coverage (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Locked dependencies
        run: npm ci
      - name: mocha, gated at 100% coverage
        run: make test
      - name: The example, over stdio
        run: make examples

  pack:
    name: npm tarball contents
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: List what npm would publish
        run: make pack
