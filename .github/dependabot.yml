#
# Weekly updates of the npm dependencies (package-lock.json) and the
# pinned workflow actions. Dependabot opens its pull requests against
# main; each update is folded into the active feat/v<next-version>
# branch and the Dependabot PR closed with a link to the release PR
# (AGENTS.md).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "ci/cd"
      - "automated"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
